  #mapButton { position: fixed; top: 18px; right: 18px; letter-spacing: .1em; text-transform: uppercase; }

  #error { display: none; position: fixed; inset: 0; padding: 15vh 12vw; background: #101413; color: #c9d0c9; line-height: 1.8; }

class Mesh {

// Canonical edge keys make independently generated neighboring rooms agree on
// the exact doorway position, leaf state and opening direction.

// A connected backbone supports an unbounded world; the intervening sections
